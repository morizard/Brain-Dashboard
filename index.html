<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d0d0f" id="meta-theme-color">
<meta name="description" content="مغزم — ژورنال، کارها، اهداف و ایده‌های شخصی">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مغز من</title>
<link rel="manifest" id="app-manifest">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --surface2: #1e1e24;
    --border: #2a2a35;
    --accent: #c8a96e;
    --accent2: #7c6fcd;
    --text: #e8e8f0;
    --text-muted: #6b6b80;
    --green: #4caf7d;
    --red: #e05555;
    --blue: #5b9cf6;
    --orange: #e08c3a;
    --on-accent: #0d0d0f;
    --header-bg: rgba(13,13,15,0.92);
    --shadow: rgba(0,0,0,0.4);
    --accent-soft: rgba(200, 169, 110, 0.12);
    --accent-soft-md: rgba(200, 169, 110, 0.18);
    --accent-soft-hover: rgba(200, 169, 110, 0.26);
    --accent-border-soft: rgba(200, 169, 110, 0.42);
    --accent-glow: rgba(200, 169, 110, 0.3);
    --purple-soft: rgba(124, 111, 205, 0.12);
    --green-soft: rgba(76, 175, 125, 0.12);
    --red-soft: rgba(224, 85, 85, 0.12);
    --orange-soft: rgba(224, 140, 58, 0.12);
    --chip-journal-bg: rgba(76, 175, 125, 0.18);
    --blue-soft: rgba(91, 156, 246, 0.18);
  }

  [data-theme="light"] {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface2: #eef1f9;
    --border: #dde3f0;
    --accent: #6d5af0;
    --accent2: #0891b2;
    --text: #1a1f36;
    --text-muted: #64748b;
    --green: #059669;
    --red: #e11d48;
    --blue: #2563eb;
    --orange: #d97706;
    --on-accent: #ffffff;
    --header-bg: rgba(255, 255, 255, 0.88);
    --shadow: rgba(15, 23, 42, 0.06);
    --accent-soft: rgba(109, 90, 240, 0.08);
    --accent-soft-md: rgba(109, 90, 240, 0.14);
    --accent-soft-hover: rgba(109, 90, 240, 0.22);
    --accent-border-soft: rgba(109, 90, 240, 0.32);
    --accent-glow: rgba(109, 90, 240, 0.18);
    --purple-soft: rgba(109, 90, 240, 0.1);
    --green-soft: rgba(5, 150, 105, 0.1);
    --red-soft: rgba(225, 29, 72, 0.1);
    --orange-soft: rgba(217, 119, 6, 0.1);
    --chip-journal-bg: rgba(5, 150, 105, 0.12);
    --blue-soft: rgba(37, 99, 235, 0.1);
  }

  [data-theme="light"] body {
    background: linear-gradient(155deg, #f8faff 0%, #f0f3fc 45%, #e8edf8 100%);
    background-attachment: fixed;
  }

  [data-theme="light"] .card {
    box-shadow: 0 1px 3px var(--shadow), 0 4px 20px rgba(15, 23, 42, 0.03);
    border-color: #e8ecf4;
  }

  [data-theme="light"] .header {
    box-shadow: 0 1px 0 var(--border);
    backdrop-filter: blur(16px);
  }

  [data-theme="light"] .stat-box {
    box-shadow: 0 1px 3px var(--shadow);
    background: linear-gradient(135deg, #ffffff 0%, #f5f7fd 100%);
  }

  [data-theme="light"] input,
  [data-theme="light"] textarea,
  [data-theme="light"] select {
    background: #ffffff;
    border-color: #dde3f0;
  }

  [data-theme="light"] input:focus,
  [data-theme="light"] textarea:focus,
  [data-theme="light"] select:focus {
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  [data-theme="light"] .tab.active {
    box-shadow: 0 -2px 0 var(--accent);
    background: var(--surface);
    color: var(--accent);
    font-weight: 600;
  }

  [data-theme="light"] .btn-primary {
    box-shadow: 0 2px 8px rgba(109, 90, 240, 0.28);
  }

  [data-theme="light"] .logo {
    background: linear-gradient(135deg, #6d5af0, #0891b2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  [data-theme="light"] .journal-entry:hover,
  [data-theme="light"] .wish-item:hover,
  [data-theme="light"] .idea-card:hover {
    box-shadow: 0 4px 16px rgba(109, 90, 240, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Vazirmatn', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    direction: rtl;
  }

  /* HEADER */
  .header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--header-bg);
    backdrop-filter: blur(12px);
  }

  .logo {
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--accent);
  }

  .date-display {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 300;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 20px 32px 0;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }

  .tab {
    padding: 10px 20px;
    border-radius: 8px 8px 0 0;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    border: none;
    background: transparent;
    font-family: 'Vazirmatn', sans-serif;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .tab.active {
    background: var(--surface);
    color: var(--accent);
    border: 1px solid var(--border);
    border-bottom: 1px solid var(--surface);
    margin-bottom: -1px;
  }

  .tab:hover:not(.active) { color: var(--text); }

  /* MAIN LAYOUT */
  .main {
    padding: 28px 32px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .page { display: none; }
  .page.active { display: block; }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .card-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 16px;
  }

  /* JOURNAL */
  .journal-entry {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.2s;
  }

  .journal-entry:hover { border-color: var(--accent); }

  .journal-date {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .journal-preview {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }

  .journal-mood {
    display: inline-block;
    margin-top: 8px;
    font-size: 18px;
  }

  /* TODO */
  .todo-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    background: var(--surface2);
    border: 1px solid transparent;
    transition: all 0.2s;
  }

  .todo-item:hover { border-color: var(--border); }
  .todo-item.done { opacity: 0.4; }
  .todo-item.done .todo-text { text-decoration: line-through; }

  .todo-check {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    margin-top: 2px;
  }

  .todo-check.checked {
    background: var(--green);
    border-color: var(--green);
  }

  .todo-text {
    font-size: 14px;
    line-height: 1.5;
    flex: 1;
  }

  .priority-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 6px;
  }

  .p-high { background: var(--red); }
  .p-mid { background: var(--accent); }
  .p-low { background: var(--green); }

  /* GOALS */
  .goal-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }

  .goal-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .goal-deadline {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .progress-bar {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
  }

  .goal-percent {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    text-align: left;
  }

  /* WISHES */
  .wish-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    background: var(--surface2);
    border-radius: 8px;
    margin-bottom: 8px;
    border: 1px solid transparent;
    transition: all 0.2s;
  }

  .wish-item:hover { border-color: var(--accent); }

  .wish-emoji { font-size: 22px; }
  .wish-text { font-size: 14px; flex: 1; }
  .wish-cat {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 99px;
    background: var(--surface);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  /* MEETINGS */
  .meeting-item {
    padding: 14px;
    background: var(--surface2);
    border-radius: 8px;
    margin-bottom: 8px;
    border-right: 3px solid var(--accent2);
  }

  .meeting-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .meeting-meta { font-size: 12px; color: var(--text-muted); }

  /* INPUT AREA */
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  input[type="text"], textarea, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Vazirmatn', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    direction: rtl;
  }

  input[type="text"]:focus, textarea:focus, select:focus {
    border-color: var(--accent);
  }

  input[type="text"] { flex: 1; }

  textarea {
    width: 100%;
    resize: vertical;
    min-height: 120px;
    line-height: 1.7;
  }

  select {
    background: var(--surface2);
    cursor: pointer;
  }

  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--on-accent);
  }

  .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }

  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .btn-ghost:hover { color: var(--text); border-color: var(--text-muted); }

  /* MOOD BUTTONS */
  .mood-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .mood-btn {
    font-size: 22px;
    background: var(--surface2);
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 8px 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .mood-btn:hover, .mood-btn.selected { border-color: var(--accent); transform: scale(1.1); }

  /* STATS */
  .stat-box {
    text-align: center;
    padding: 20px;
    background: var(--surface2);
    border-radius: 10px;
  }

  .stat-num {
    font-size: 32px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label { font-size: 12px; color: var(--text-muted); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open { display: flex; }

  @keyframes searchJumpFlash {
    0%, 100% { box-shadow: none; }
    20%, 60% { box-shadow: 0 0 0 2px var(--accent); }
  }
  .search-jump-highlight { animation: searchJumpFlash 1.4s ease-in-out; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    width: 90%;
    max-width: 560px;
    max-height: 85vh;
    overflow-y: auto;
  }

  .modal-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--accent);
  }

  .form-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: block;
    font-weight: 600;
  }

  .form-group { margin-bottom: 14px; }

  .delete-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    border-radius: 4px;
    transition: color 0.2s;
    flex-shrink: 0;
  }

  .delete-btn:hover { color: var(--red); }

  /* WEEK OVERVIEW */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }

  .week-day {
    text-align: center;
    padding: 10px 4px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 12px;
  }

  .week-day:hover, .week-day.today {
    border-color: var(--accent);
  }

  .week-day.today { background: var(--accent-soft); }
  .week-day.selected-day { background: var(--accent-soft-md); border-color: var(--accent); }

  .week-day-name { color: var(--text-muted); font-size: 10px; margin-bottom: 4px; }
  .week-day-num { font-weight: 700; font-size: 14px; }
  .week-dot { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; margin: 4px auto 0; }

  .goal-filter-btn.active {
    background: var(--surface2);
    color: var(--accent);
    border-color: var(--accent);
  }

  .horizon-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid;
  }
  .h-short { color: var(--green); border-color: var(--green); background: var(--green-soft); }
  .h-mid   { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .h-long  { color: var(--accent2); border-color: var(--accent2); background: var(--purple-soft); }

  .priority-flag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid;
  }
  .pf-1 { color: var(--red); border-color: var(--red); background: rgba(224,85,85,0.1); }
  .pf-2 { color: var(--orange); border-color: var(--orange); background: var(--orange-soft); }
  .pf-3 { color: var(--text-muted); border-color: var(--border); background: transparent; }

  .summary-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-bar-wrap { flex: 1; }
  .summary-bar-bg { height: 5px; background: var(--border); border-radius: 99px; }
  .summary-bar-fill { height: 5px; border-radius: 99px; transition: width 0.5s; }
  .emoji-cat-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    font-family: 'Vazirmatn', sans-serif;
    transition: all 0.15s;
  }
  .emoji-cat-btn:hover { color: var(--text); border-color: var(--text-muted); }
  .emoji-cat-btn.active { background: var(--surface); color: var(--accent); border-color: var(--accent); }

  .emoji-btn {
    font-size: 20px;
    background: var(--surface2);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 6px;
    cursor: pointer;
    transition: all 0.15s;
    line-height: 1;
  }
  .emoji-btn:hover { border-color: var(--accent); transform: scale(1.15); background: var(--accent-soft); }
  .emoji-btn.selected { border-color: var(--accent); background: var(--accent-soft-md); }

  /* CALENDAR */
  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding: 0 4px;
  }
  .cal-nav-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    cursor: pointer;
    font-size: 18px;
    padding: 8px 16px;
    transition: all 0.2s;
    font-family: 'Vazirmatn', sans-serif;
    line-height: 1;
  }
  .cal-nav-btn:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.05); }
  .cal-month-title {
    font-size: 22px;
    font-weight: 900;
    color: var(--text);
    letter-spacing: -0.5px;
    cursor: pointer;
    transition: color 0.2s;
  }
  .cal-month-title:hover { color: var(--accent); }
  .cal-month-title span { color: var(--accent); }
  .cal-today-btn {
    background: var(--accent-soft);
    border: 1px solid var(--accent-border-soft);
    border-radius: 8px;
    color: var(--accent);
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    font-family: 'Vazirmatn', sans-serif;
    transition: all 0.2s;
  }
  .cal-today-btn:hover { background: var(--accent-soft-hover); }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin-bottom: 6px;
  }
  .cal-weekday-label {
    text-align: center;
    font-size: 9px;
    font-weight: 700;
    color: var(--text-muted);
    padding: 6px 1px;
    letter-spacing: -0.3px;
  }
  .cal-weekday-label.friday { color: var(--accent2); }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-cell {
    min-height: 86px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 6px 5px;
    cursor: pointer;
    transition: all 0.18s;
    position: relative;
    overflow: hidden;
  }
  .cal-cell:hover { border-color: var(--accent); background: var(--accent-soft); z-index:1; }
  .cal-cell.today {
    border-color: var(--accent);
    background: var(--accent-soft-md);
  }
  .cal-cell.selected {
    border-color: var(--accent);
    background: var(--accent-soft-md);
    box-shadow: 0 0 0 2px var(--accent-glow);
  }
  .cal-cell.other-month { opacity: 0.35; }
  .cal-cell.friday-cell { border-color: var(--accent-border-soft); }
  .cal-cell.friday-cell:hover { border-color: var(--accent2); }
  .cal-day-num {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .cal-today-ring {
    width: 22px; height: 22px;
    background: var(--accent);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 900; color: var(--on-accent);
    margin: -2px -2px 2px auto;
  }
  .cal-dot-row {
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
    margin-top: 2px;
  }
  .cal-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .cal-event-chip {
    font-size: 10px;
    padding: 2px 5px;
    border-radius: 4px;
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    display: block;
    font-weight: 600;
    line-height: 1.4;
  }
  .chip-todo   { background: var(--red-soft);   color: var(--red); }
  .chip-goal   { background: var(--purple-soft); color: var(--accent2); }
  .chip-meet   { background: var(--blue-soft);  color: var(--blue); }
  .chip-journal{ background: var(--chip-journal-bg);  color: var(--green); }

  /* DAY DETAIL PANEL */
  .cal-detail {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 24px;
    margin-top: 16px;
    animation: slideDown 0.2s ease;
  }
  @keyframes slideDown {
    from { opacity:0; transform:translateY(-8px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .cal-detail-title {
    font-size: 17px;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cal-detail-section {
    margin-bottom: 14px;
  }
  .cal-detail-section-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 7px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cal-detail-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    margin-bottom: 6px;
    font-size: 13px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
    line-height: 1.4;
  }
  .cal-detail-empty {
    color: var(--text-muted);
    font-size: 12px;
    padding: 4px 0;
    font-style: italic;
  }
  .cal-legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .cal-legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .idea-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    transition: border-color 0.2s, transform 0.15s;
    position: relative;
  }
  .idea-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .idea-card.pinned { border-color: var(--accent); background: var(--accent-soft); }
  .idea-status-badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid;
  }
  .is-new    { color: var(--blue); border-color: var(--blue); background: var(--blue-soft); }
  .is-wip    { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .is-done   { color: var(--green); border-color: var(--green); background: var(--green-soft); }
  .idea-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 11px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    margin-left: 4px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .idea-tag:hover { border-color: var(--accent); color: var(--accent); }
  .idea-color-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    display: inline-block;
    margin-left: 6px;
    flex-shrink: 0;
  }
  .idea-search-bar {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Vazirmatn', sans-serif;
    font-size: 14px;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
    direction: rtl;
  }
  .idea-search-bar:focus { border-color: var(--accent); }
  .idea-filter-btn {
    padding: 6px 14px;
    border-radius: 99px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-family: 'Vazirmatn', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .idea-filter-btn:hover { color: var(--text); border-color: var(--text-muted); }
  .idea-filter-btn.active { background: var(--accent-soft-md); color: var(--accent); border-color: var(--accent); }
  .idea-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-top: 6px;
    white-space: pre-wrap;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  body::-webkit-scrollbar { display: none; }
  body { scrollbar-width: none; -ms-overflow-style: none; }

  @media (max-width: 640px) {
    .main { padding: 20px 16px; }
    .header { padding: 16px; }
    .tabs { padding: 16px 16px 0; }
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .week-grid { grid-template-columns: repeat(7, 1fr); }
  }

  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .empty-emoji { font-size: 32px; margin-bottom: 10px; }

  .tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 11px;
    border: 1px solid var(--border);
    color: var(--text-muted);
    margin-right: 4px;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 18px;
    font-weight: 700;
  }

  /* DRAG & DROP */
  .todo-item.dragging, .idea-card.dragging {
    opacity: 0.45;
    border-color: var(--accent) !important;
  }
  .todo-item.drag-over, .idea-card.drag-over {
    border-top: 2px solid var(--accent);
  }
  .drag-handle {
    cursor: grab;
    color: var(--text-muted);
    font-size: 14px;
    padding: 2px 4px;
    flex-shrink: 0;
    user-select: none;
    opacity: 0.5;
    transition: opacity 0.2s;
  }
  .todo-item:hover .drag-handle, .idea-card:hover .drag-handle { opacity: 1; }
  .drag-handle:active { cursor: grabbing; }

  /* TREND CHARTS */
  .trend-chart {
    display: flex;
    gap: 3px;
    align-items: flex-end;
    height: 80px;
    margin-top: 8px;
  }
  .trend-bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 0;
  }
  .trend-bar-wrap {
    width: 100%;
    height: 60px;
    background: var(--border);
    border-radius: 4px 4px 0 0;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }
  .trend-bar-fill {
    width: 100%;
    border-radius: 4px 4px 0 0;
    transition: height 0.4s;
    min-height: 0;
  }
  .trend-bar-label {
    font-size: 9px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">🧠 مغزم</div>
  <div style="display:flex;align-items:center;gap:12px">
    <div class="date-display" id="headerDate"></div>
    <div style="display:flex;align-items:center;gap:6px">
      <button id="sync-btn" onclick="syncToCloud()" style="
        background:var(--surface2);border:1px solid var(--border);border-radius:8px;
        padding:7px 12px;cursor:pointer;font-family:Vazirmatn,sans-serif;
        font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px;
        transition:all 0.2s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
        <span id="sync-badge">⚙️</span>
        <span>سینک</span>
      </button>
      <button onclick="syncFromCloud()" style="
        background:none;border:1px solid var(--border);border-radius:8px;
        padding:7px 10px;cursor:pointer;font-size:13px;color:var(--text-muted);
        transition:all 0.2s" title="دریافت از cloud" onmouseover="this.style.borderColor='var(--accent2)'" onmouseout="this.style.borderColor='var(--border)'">⬇️</button>
      <button onclick="openGlobalSearch()" style="
        background:none;border:1px solid var(--border);border-radius:8px;
        padding:7px 10px;cursor:pointer;font-size:13px;color:var(--text-muted);
        transition:all 0.2s" title="جستجوی سراسری" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">🔍</button>
      <button onclick="openSBSettings()" style="
        background:none;border:1px solid var(--border);border-radius:8px;
        padding:7px 10px;cursor:pointer;font-size:13px;color:var(--text-muted);
        transition:all 0.2s" title="تنظیمات cloud" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">⚙️</button>
      <button onclick="openBackupModal()" style="
        background:none;border:1px solid var(--border);border-radius:8px;
        padding:7px 10px;cursor:pointer;font-size:13px;color:var(--text-muted);
        transition:all 0.2s" title="پشتیبان‌گیری / بازیابی (فایل)" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">💾</button>
      <button id="theme-toggle-btn" onclick="toggleTheme()" style="
        background:none;border:1px solid var(--border);border-radius:8px;
        padding:7px 10px;cursor:pointer;font-size:13px;color:var(--text-muted);
        transition:all 0.2s" title="حالت روشن/تاریک" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">🌙</button>
      <button id="notif-btn" onclick="openNotifSettings()" style="
        background:none;border:1px solid var(--border);border-radius:8px;
        padding:7px 10px;cursor:pointer;font-size:13px;color:var(--text-muted);
        transition:all 0.2s" title="یادآوری‌ها" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">🔔</button>
    </div>
  </div>
</div>
<input type="file" id="backup-file-input" accept="application/json" style="display:none" onchange="handleImportFile(event)">

<!-- TOAST -->
<div id="toast" style="
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:10px 20px;font-size:14px;font-family:Vazirmatn,sans-serif;
  color:var(--text);z-index:500;opacity:0;transition:all 0.3s;pointer-events:none;
  box-shadow:0 4px 20px var(--shadow)
"></div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('dashboard')">داشبورد</button>
  <button class="tab" onclick="switchTab('calendar')">📅 تقویم</button>
  <button class="tab" onclick="switchTab('journal')">ژورنال</button>
  <button class="tab" onclick="switchTab('todos')">کارها</button>
  <button class="tab" onclick="switchTab('goals')">اهداف</button>
  <button class="tab" onclick="switchTab('wishes')">آرزوها</button>
  <button class="tab" onclick="switchTab('meetings')">جلسات</button>
  <button class="tab" onclick="switchTab('ideas')">💡 ایده‌ها</button>
</div>

<div class="main">

  <!-- DASHBOARD -->
  <div class="page active" id="page-dashboard">
    <div class="grid-3" style="margin-bottom:20px">
      <div class="stat-box">
        <div class="stat-num" id="stat-todos">0</div>
        <div class="stat-label">کار در صف</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-goals">0</div>
        <div class="stat-label">هدف فعال</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="stat-journal" style="font-size:28px;line-height:1.2">—</div>
        <div class="stat-label" id="stat-journal-label">حال هفته</div>
      </div>
    </div>

    <!-- Week view -->
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="card-title" style="margin:0">هفته جاری</div>
        <div style="display:flex;align-items:center;gap:10px">
          <button onclick="navigateWeek(-1)" style="background:none;border:1px solid var(--border);border-radius:8px;color:var(--text-muted);cursor:pointer;padding:4px 10px;font-size:13px;font-family:Vazirmatn,sans-serif;transition:all 0.2s" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-muted)'">‹ قبل</button>
          <div id="week-month-label" style="font-size:13px;color:var(--accent);font-weight:600;min-width:100px;text-align:center"></div>
          <button onclick="navigateWeek(1)" style="background:none;border:1px solid var(--border);border-radius:8px;color:var(--text-muted);cursor:pointer;padding:4px 10px;font-size:13px;font-family:Vazirmatn,sans-serif;transition:all 0.2s" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-muted)'">بعد ›</button>
        </div>
      </div>
      <div class="week-grid" id="weekGrid"></div>
    </div>

    <!-- Selected day todos -->
    <div class="card">
      <div class="section-header">
        <div class="card-title" style="margin:0" id="dashboard-todos-title">کارهای مهم امروز</div>
        <button class="btn btn-ghost" style="font-size:12px;padding:6px 12px" onclick="switchTab('todos')">همه ←</button>
      </div>
      <div id="dashboard-todos"></div>
    </div>

    <!-- Upcoming meetings -->
    <div class="card">
      <div class="section-header">
        <div class="card-title" style="margin:0">جلسات پیش‌رو</div>
        <button class="btn btn-ghost" style="font-size:12px;padding:6px 12px" onclick="switchTab('meetings')">همه ←</button>
      </div>
      <div id="dashboard-meetings"></div>
    </div>

    <!-- Long-term trends -->
    <div class="card">
      <div class="section-header">
        <div class="card-title" style="margin:0">📈 روند بلندمدت</div>
        <select id="trend-range" onchange="renderLongTermTrends()" style="font-size:12px;padding:4px 8px;border-radius:6px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:Vazirmatn,sans-serif">
          <option value="3">۳ ماه</option>
          <option value="6" selected>۶ ماه</option>
          <option value="12">۱۲ ماه</option>
        </select>
      </div>
      <div id="dashboard-trends"></div>
    </div>
  </div>

  <!-- CALENDAR -->
  <div class="page" id="page-calendar">

    <div class="card" style="padding:24px">
      <!-- Header -->
      <div class="cal-header">
        <button class="cal-nav-btn" onclick="calNav(-1)">‹</button>
        <div style="text-align:center">
          <div class="cal-month-title" id="cal-month-title" onclick="openCalMonthPicker()" title="برای تغییر کلیک کن">—</div>
          <div style="font-size:11px;color:var(--text-muted);margin-top:2px" id="cal-year-sub"></div>
        </div>
        <button class="cal-nav-btn" onclick="calNav(1)">›</button>
      </div>

      <div style="display:flex;justify-content:center;margin-bottom:18px">
        <button class="cal-today-btn" onclick="calGoToday()">● برو به امروز</button>
      </div>

      <!-- Weekday labels -->
      <div class="cal-weekdays">
        <div class="cal-weekday-label">شنبه</div>
        <div class="cal-weekday-label">یکشنبه</div>
        <div class="cal-weekday-label">دوشنبه</div>
        <div class="cal-weekday-label">سه‌شنبه</div>
        <div class="cal-weekday-label">چهارشنبه</div>
        <div class="cal-weekday-label">پنجشنبه</div>
        <div class="cal-weekday-label friday">جمعه</div>
      </div>

      <!-- Grid -->
      <div class="cal-grid" id="cal-grid"></div>

      <!-- Legend -->
      <div class="cal-legend">
        <div class="cal-legend-item"><div class="cal-dot" style="background:#e05555"></div> کار فوری</div>
        <div class="cal-legend-item"><div class="cal-dot" style="background:#7c6fcd"></div> هدف</div>
        <div class="cal-legend-item"><div class="cal-dot" style="background:#5b9cf6"></div> جلسه</div>
        <div class="cal-legend-item"><div class="cal-dot" style="background:#4caf7d"></div> ژورنال</div>
      </div>
    </div>

    <!-- Day detail -->
    <div id="cal-detail-panel"></div>

  </div>

  <!-- JOURNAL -->
  <div class="page" id="page-journal">

    <!-- JOURNAL SUMMARY -->
    <div class="card" id="journal-summary-card">
      <div id="journal-summary-content"></div>
    </div>

    <div class="card">
      <div class="section-header">
        <div class="section-title">📔 ژورنال امروز</div>
        <div id="journal-today-date" style="font-size:13px;color:var(--text-muted)"></div>
      </div>

      <div class="form-group">
        <label class="form-label">الان چه ساعتیه؟ (اختیاری)</label>
        <div style="display:flex;gap:8px;align-items:center">
          <input type="text" id="journal-time" placeholder="ساعت فعلی" readonly style="max-width:120px;cursor:pointer" onclick="openTimePicker('journal-time')">
          <button type="button" class="btn btn-ghost" onclick="openTimePicker('journal-time')" style="padding:10px 12px">🕐</button>
          <button type="button" class="btn btn-ghost" onclick="setJournalTimeNow()" style="padding:10px 12px;font-size:12px">الان</button>
          <button type="button" class="btn btn-ghost" onclick="document.getElementById('journal-time').value=''" style="padding:10px 12px;color:var(--text-muted);font-size:12px">✕</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">حالت الانت چطوره؟</label>
        <div class="mood-row">
          <button class="mood-btn" onclick="selectMood(this,'😁')">😁</button>
          <button class="mood-btn" onclick="selectMood(this,'🙂')">🙂</button>
          <button class="mood-btn" onclick="selectMood(this,'😐')">😐</button>
          <button class="mood-btn" onclick="selectMood(this,'😔')">😔</button>
          <button class="mood-btn" onclick="selectMood(this,'😤')">😤</button>
          <button class="mood-btn" onclick="selectMood(this,'😰')">😰</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">چی توی ذهنته؟</label>
        <textarea id="journal-text" placeholder="بنویس... هر چیزی که میخوای. اینجا فقط برای توئه."></textarea>
      </div>

      <button class="btn btn-primary" onclick="saveJournal()">ذخیره ←</button>
    </div>

    <div class="card">
      <div class="card-title">ورودی‌های قبلی</div>
      <div id="journal-list"></div>
    </div>
  </div>

  <!-- TODOS -->
  <div class="page" id="page-todos">
    <div class="card" id="todos-summary">
      <div id="todos-summary-content"></div>
    </div>

    <div class="card">
      <div class="input-row">
        <input type="text" id="todo-input" placeholder="کار جدید بنویس..." onkeydown="if(event.key==='Enter')addTodo()">
        <select id="todo-priority">
          <option value="high">🔴 فوری</option>
          <option value="mid" selected>🟡 معمولی</option>
          <option value="low">🟢 زمانی</option>
        </select>
        <button class="btn btn-primary" onclick="addTodo()">+</button>
      </div>
      <div class="input-row">
        <input type="text" id="todo-tag" placeholder="برچسب (اختیاری)" style="max-width:150px">
        <input type="text" id="todo-date" placeholder="سررسید (اختیاری)" readonly style="max-width:170px;cursor:pointer" onclick="openPicker('todo-date')">
        <button class="btn btn-ghost" onclick="openPicker('todo-date')" style="padding:10px 12px">📅</button>
        <input type="text" id="todo-time" placeholder="ساعت (اختیاری)" readonly style="max-width:130px;cursor:pointer" onclick="openTimePicker('todo-time')">
        <button class="btn btn-ghost" onclick="openTimePicker('todo-time')" style="padding:10px 12px">🕐</button>
        <select id="todo-repeat" style="max-width:140px" title="تکرار">
          <option value="none" selected>🔁 بدون تکرار</option>
          <option value="daily">🔁 هر روز</option>
          <option value="weekly">🔁 هر هفته</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="section-header">
        <div class="section-title">🔴 فوری</div>
      </div>
      <div id="todos-high"></div>
    </div>

    <div class="card">
      <div class="section-header">
        <div class="section-title">🟡 معمولی</div>
      </div>
      <div id="todos-mid"></div>
    </div>

    <div class="card">
      <div class="section-header">
        <div class="section-title">🟢 زمانی</div>
      </div>
      <div id="todos-low"></div>
    </div>

    <div class="card">
      <div class="section-header">
        <div class="section-title" style="color:var(--text-muted)">✅ انجام‌شده</div>
        <button class="btn btn-ghost" style="font-size:12px;padding:6px 12px;color:var(--red)" onclick="clearDone()">پاک‌کردن</button>
      </div>
      <div id="todos-done"></div>
    </div>
  </div>

  <!-- GOALS -->

<script>
// ─── JALALI CALENDAR ─────────────────────────────────────────────────────────
const J = {
  // Gregorian to Jalali
  toJalali(gy, gm, gd) {
    let g_d_no, j_d_no, j_np, i;
    const g_days_in_month = [31,28,31,30,31,30,31,31,30,31,30,31];
    const j_days_in_month = [31,31,31,31,31,31,30,30,30,30,30,29];
    gy -= 1600; gm -= 1; gd -= 1;
    g_d_no = 365*gy + Math.floor((gy+3)/4) - Math.floor((gy+99)/100) + Math.floor((gy+399)/400);
    for(i=0;i<gm;i++) g_d_no += g_days_in_month[i];
    if(gm>1 && ((gy%4==0 && gy%100!=0) || (gy%400==0))) g_d_no++;
    g_d_no += gd;
    j_d_no = g_d_no - 79;
    j_np = Math.floor(j_d_no/12053); j_d_no %= 12053;
    let jy = 979 + 33*j_np + 4*Math.floor(j_d_no/1461);
    j_d_no %= 1461;
    if(j_d_no >= 366){ jy += Math.floor((j_d_no-1)/365); j_d_no = (j_d_no-1)%365; }
    for(i=0; i<11 && j_d_no >= j_days_in_month[i]; i++) j_d_no -= j_days_in_month[i];
    return [jy, i+1, j_d_no+1];
  },
  // Jalali to Gregorian
  toGregorian(jy, jm, jd) {
    let i, j_d_no, gy, gd;
    const j_days_in_month = [31,31,31,31,31,31,30,30,30,30,30,29];
    const g_days_in_month = [31,28,31,30,31,30,31,31,30,31,30,31];
    jy -= 979; jm -= 1; jd -= 1;
    j_d_no = 365*jy + Math.floor(jy/33)*8 + Math.floor((jy%33+3)/4);
    for(i=0;i<jm;i++) j_d_no += j_days_in_month[i];
    j_d_no += jd;
    let g_d_no = j_d_no + 79;
    let gy0 = 1600 + 400*Math.floor(g_d_no/146097); g_d_no %= 146097;
    let leap = true;
    if(g_d_no >= 36525){ g_d_no--; gy0 += 100*Math.floor(g_d_no/36524); g_d_no %= 36524;
      if(g_d_no >= 365) g_d_no++; else leap = false; }
    gy0 += 4*Math.floor(g_d_no/1461); g_d_no %= 1461;
    if(g_d_no >= 366){ leap = false; g_d_no--; gy0 += Math.floor(g_d_no/365); g_d_no %= 365; }
    for(i=0; g_d_no >= g_days_in_month[i] + (i==1 && leap ? 1:0); i++) g_d_no -= g_days_in_month[i] + (i==1 && leap?1:0);
    return [gy0, i+1, g_d_no+1];
  },
  // today as Jalali array
  todayJ() { const d=new Date(); return this.toJalali(d.getFullYear(),d.getMonth()+1,d.getDate()); },
  // Jalali date string YYYY/MM/DD → store key
  jStrToKey(s) { return s.replace(/\//g,'-'); },
  keyToJStr(s) { return s.replace(/-/g,'/'); },
  // Parse jalali string "1403/06/15" → [y,m,d]
  parseJ(s) { return s.split('/').map(Number); },
  // Format jalali for display
  monthNames: ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'],
  weekDayNames: ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'],
  weekDayShort: ['ش','ی','د','س','چ','پ','ج'],
  
  displayDate(key) { // key is YYYY-MM-DD gregorian internally OR jalali YYYY-MM-DD
    // We store as jalali key internally now
    const parts = key.split('-').map(Number);
    if(parts[0] > 1500) {
      // gregorian, convert
      const [jy,jm,jd] = this.toJalali(parts[0],parts[1],parts[2]);
      const gDate = new Date(parts[0],parts[1]-1,parts[2]);
      const dow = this.weekDayNames[(gDate.getDay()+1)%7];
      return `${dow} ${jd} ${this.monthNames[jm-1]} ${jy}`;
    } else {
      // jalali key
      const [jy,jm,jd] = parts;
      const [gy,gm,gd] = this.toGregorian(jy,jm,jd);
      const gDate = new Date(gy,gm-1,gd);
      const dow = this.weekDayNames[(gDate.getDay()+1)%7];
      return `${dow} ${jd} ${this.monthNames[jm-1]} ${jy}`;
    }
  },
  // Get today as storage key (jalali)
  todayKey() {
    const [jy,jm,jd] = this.todayJ();
    return `${jy}-${String(jm).padStart(2,'0')}-${String(jd).padStart(2,'0')}`;
  },
  // Compare two jalali keys
  compareKeys(a,b) { return a > b ? 1 : a < b ? -1 : 0; },
  // Gregorian date to jalali key
  gDateToKey(d) {
    const [jy,jm,jd] = this.toJalali(d.getFullYear(),d.getMonth()+1,d.getDate());
    return `${jy}-${String(jm).padStart(2,'0')}-${String(jd).padStart(2,'0')}`;
  },
  // Jalali key to Gregorian Date object
  keyToGDate(key) {
    const [jy,jm,jd] = key.split('-').map(Number);
    const [gy,gm,gdd] = this.toGregorian(jy,jm,jd);
    return new Date(gy,gm-1,gdd);
  }
};

// ─── STATE ───────────────────────────────────────────────────────────────────
const state = {
  todos: [],
  goals: [],
  wishes: [],
  meetings: [],
  journal: [],
  ideas: []
};

let selectedMood = '';

// ─── STORAGE (v2: single consolidated, versioned key) ────────────────────────
// Old structure: 6 separate localStorage keys (brain_todos, brain_goals, ...).
// New structure: one JSON blob under 'brain_data_v2' = { version, updatedAt, todos, goals, ... }
// This makes full export/import, backup, and future migrations far simpler,
// and avoids 6 separate read/write round-trips on every save.
const STORAGE_KEY = 'brain_data_v2';
const DATA_KEYS = ['todos','goals','wishes','meetings','journal','ideas'];

function esc(str) {
  // Escape HTML-sensitive characters before inserting user text into innerHTML.
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function readConsolidated() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) { /* fall through */ }
  return null;
}

function writeConsolidated(data) {
  data.version = 2;
  data.updatedAt = new Date().toISOString();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// One-time migration from the old per-key format (v1) to the consolidated format (v2).
// Old keys are kept as a safety backup (renamed) instead of being deleted outright.
function migrateOldStorageIfNeeded() {
  let foundOld = false;
  const migrated = {};
  DATA_KEYS.forEach(k => {
    const old = localStorage.getItem('brain_' + k);
    if (old !== null) {
      foundOld = true;
      try { migrated[k] = JSON.parse(old) || []; } catch(e) { migrated[k] = []; }
    } else {
      migrated[k] = [];
    }
  });
  if (foundOld) {
    writeConsolidated(migrated);
    DATA_KEYS.forEach(k => {
      const old = localStorage.getItem('brain_' + k);
      if (old !== null) {
        localStorage.setItem('brain_' + k + '_v1_backup', old);
        localStorage.removeItem('brain_' + k);
      }
    });
  }
  return migrated;
}

// Load from localStorage into state
function load() {
  let data = readConsolidated();
  if (!data) data = migrateOldStorageIfNeeded();
  DATA_KEYS.forEach(k => {
    state[k] = Array.isArray(data[k]) ? data[k] : [];
  });
  // Backfill goal progress history for older data
  state.goals.forEach(g => {
    if (!Array.isArray(g.history)) g.history = [{ date: todayStr(), progress: g.progress || 0 }];
  });
}

function save(key) {
  const data = readConsolidated() || {};
  data[key] = state[key];
  writeConsolidated(data);
}

// ─── BACKUP / RESTORE (manual JSON file, independent of Supabase) ────────────
function openBackupModal() {
  const content = document.getElementById('modal-content');
  content.innerHTML = `
    <div class="modal-title">💾 پشتیبان‌گیری و بازیابی</div>
    <div style="font-size:13px;color:var(--text-muted);line-height:1.8;margin-bottom:16px">
      کل اطلاعات (ژورنال، کارها، اهداف، آرزوها، جلسات، ایده‌ها) توی یک فایل JSON ذخیره یا بازیابی می‌شه.
      این کاملاً مستقل از Supabase و آفلاینه.
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="exportBackup()">⬇️ دانلود فایل پشتیبان</button>
      <button class="btn btn-ghost" onclick="document.getElementById('backup-file-input').click()">⬆️ بازیابی از فایل</button>
      <button class="btn btn-ghost" onclick="closeModal()">بستن</button>
    </div>
    <div style="font-size:12px;color:var(--red);margin-top:14px">⚠️ بازیابی از فایل، اطلاعات فعلی رو کامل جایگزین می‌کنه.</div>
  `;
  document.getElementById('modal').classList.add('open');
}

function exportBackup() {
  const data = readConsolidated() || {};
  DATA_KEYS.forEach(k => { data[k] = state[k]; });
  data.version = 2;
  data.exportedAt = new Date().toISOString();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'maghzam-backup-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('✅ فایل پشتیبان دانلود شد');
}

function handleImportFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm('اطلاعات فعلی با محتوای این فایل جایگزین می‌شه. مطمئنی؟')) return;
      DATA_KEYS.forEach(k => {
        state[k] = Array.isArray(data[k]) ? data[k] : [];
      });
      writeConsolidated(Object.assign({}, data, { version: 2 }));
      renderAll();
      closeModal();
      showToast('✅ اطلاعات از فایل بازیابی شد');
    } catch (err) {
      alert('فایل معتبر نیست: ' + err.message);
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// ─── DATE ────────────────────────────────────────────────────────────────────
function todayStr() { return J.todayKey(); }
function displayDate(d) { return J.displayDate(d); }

function initDates() {
  const [jy,jm,jd] = J.todayJ();
  document.getElementById('headerDate').textContent = `${jd} ${J.monthNames[jm-1]} ${jy}`;
  document.getElementById('journal-today-date').textContent = displayDate(todayStr());
}

// ─── WEEK GRID ───────────────────────────────────────────────────────────────
let selectedWeekDay = null; // jalali key of selected day, null = today
let weekOffset = 0; // 0 = current week, -1 = last week, +1 = next week

function navigateWeek(dir) {
  weekOffset += dir;
  selectedWeekDay = null;
  buildWeekGrid();
}

function buildWeekGrid() {
  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';

  const today = new Date();
  const todayKey = J.gDateToKey(today);

  // Find Saturday of the current week, then offset by weekOffset * 7
  const dayOfWeek = today.getDay();
  const sinceLastSat = (dayOfWeek === 6) ? 0 : dayOfWeek + 1;
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - sinceLastSat + weekOffset * 7);

  // Show month/year label
  const [jy0, jm0] = J.toJalali(weekStart.getFullYear(), weekStart.getMonth()+1, weekStart.getDate());
  // Check if week spans two months
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6);
  const [jy1, jm1] = J.toJalali(weekEnd.getFullYear(), weekEnd.getMonth()+1, weekEnd.getDate());
  const monthLabel = document.getElementById('week-month-label');
  if (monthLabel) {
    if (jm0 !== jm1) {
      monthLabel.textContent = J.monthNames[jm0-1] + ' / ' + J.monthNames[jm1-1] + ' ' + jy0;
    } else {
      monthLabel.textContent = J.monthNames[jm0-1] + ' ' + jy0;
    }
    // Add "این هفته" badge if on current week
    if (weekOffset === 0) {
      monthLabel.innerHTML += ' <span style="font-size:10px;background:' + accentHighlight(0.2) + ';border:1px solid var(--accent);border-radius:99px;padding:1px 7px;vertical-align:middle">این هفته</span>';
    }
  }

  const fullDayNames = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];

  for (let i = 0; i < 7; i++) {
    const d = new Date(weekStart);
    d.setDate(weekStart.getDate() + i);
    const dKey = J.gDateToKey(d);
    const [jy, jm, jd] = J.toJalali(d.getFullYear(), d.getMonth()+1, d.getDate());
    const hasEntry = state.journal.some(j => j.date === dKey);
    const isToday = dKey === todayKey;
    const isSelected = dKey === (selectedWeekDay || (weekOffset === 0 ? todayKey : null));

    const el = document.createElement('div');
    el.className = 'week-day' + (isToday ? ' today' : '') + (isSelected ? ' selected-day' : '');
    el.style.cursor = 'pointer';
    el.innerHTML = `
      <div class="week-day-name" style="font-size:9px">${fullDayNames[i]}</div>
      <div class="week-day-num">${jd}</div>
      ${hasEntry ? '<div class="week-dot"></div>' : '<div style="height:5px"></div>'}
    `;
    el.addEventListener('click', () => selectWeekDay(dKey));
    grid.appendChild(el);
  }

  renderDashboardTodos();
}

function selectWeekDay(key) {
  selectedWeekDay = key;
  buildWeekGrid();
}

function renderDashboardTodos() {
  const dash = document.getElementById('dashboard-todos');
  const titleEl = document.getElementById('dashboard-todos-title');
  if (!dash) return;

  const todayKey = J.gDateToKey(new Date());
  const targetKey = selectedWeekDay || todayKey;
  const isToday = targetKey === todayKey;

  if (titleEl) {
    if (isToday) {
      titleEl.textContent = 'کارهای مهم امروز';
    } else {
      const [jy, jm, jd] = targetKey.split('-').map(Number);
      titleEl.textContent = 'کارهای مهم ' + jd + ' ' + J.monthNames[jm-1];
    }
  }

  // For "today": high-priority todos with no due date are treated as general/ongoing,
  // so they show up too. For any OTHER selected day, only show todos actually due
  // that day — showing unrelated undated todos under a specific date's heading
  // would incorrectly imply they're due on that day.
  let urgent;
  if (isToday) {
    urgent = state.todos.filter(t => !t.done && t.priority === 'high').slice(0, 5);
  } else {
    urgent = state.todos.filter(t => !t.done && t.priority === 'high' && t.dueDate === targetKey).slice(0, 5);
  }

  if (!urgent.length) {
    dash.innerHTML = '<div class="empty-state" style="padding:20px"><div class="empty-emoji">✨</div>هیچ کار فوری‌ای نداری!</div>';
    return;
  }

  const today = todayKey;
  function dueDateBadge(t) {
    if (!t.dueDate && !t.dueTime) return '';
    const isOverdue = !t.done && t.dueDate && J.compareKeys(t.dueDate, today) < 0;
    const color = isOverdue ? 'var(--red)' : 'var(--text-muted)';
    const icon = isOverdue ? '⚠️' : '📅';
    let label = '';
    if (t.dueDate) {
      const [jy,jm,jd] = t.dueDate.split('-').map(Number);
      label += icon + ' ' + jd + ' ' + J.monthNames[jm-1];
    }
    if (t.dueTime) label += (label ? ' · ' : '🕐 ') + t.dueTime;
    return '<span style="font-size:11px;color:' + color + ';margin-right:6px">' + label + '</span>';
  }

  dash.innerHTML = urgent.map(t => `
    <div class="todo-item">
      <div class="priority-dot p-high"></div>
      <div class="todo-check ${t.done?'checked':''}" onclick="toggleTodo(${t.id})">${t.done?'✓':''}</div>
      <div class="todo-text">
        <div>${esc(t.text)}</div>
        <div style="margin-top:3px">${dueDateBadge(t)}</div>
      </div>
    </div>
  `).join('');
}

function renderJournalSummary() {
  const el = document.getElementById('journal-summary-content');
  if (!el) return;

  const MOOD_SCORE = { '😁':5, '🙂':4, '😐':3, '😔':2, '😤':2, '😰':1 };
  const MOOD_LABEL = { 5:'عالی 😁', 4:'خوب 🙂', 3:'معمولی 😐', 2:'بد 😔', 1:'خیلی بد 😰' };
  const MOOD_COLOR = { 5:'#4caf7d', 4:'#8bc34a', 3:'#c8a96e', 2:'#e08c3a', 1:'#e05555' };

  // helpers
  function getKeys(daysBack) {
    var keys = [];
    for (var i = 0; i < daysBack; i++) {
      var d = new Date(); d.setDate(d.getDate() - i);
      keys.push(J.gDateToKey(d));
    }
    return keys;
  }

  function avgMood(entries) {
    var scored = entries.filter(j => j.mood && MOOD_SCORE[j.mood]);
    if (!scored.length) return null;
    return scored.reduce((s,j) => s + MOOD_SCORE[j.mood], 0) / scored.length;
  }

  function dominantMood(entries) {
    var counts = {};
    entries.forEach(j => { if (j.mood) counts[j.mood] = (counts[j.mood]||0)+1; });
    var best = Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];
    return best ? best[0] : null;
  }

  // Get jalali current month range
  var [jy, jm] = J.todayJ();
  var monthKeys = [];
  var daysInMonth = [0,31,31,31,31,31,31,30,30,30,30,30,29][jm];
  for (var d = 1; d <= daysInMonth; d++) {
    monthKeys.push(jy + '-' + String(jm).padStart(2,'0') + '-' + String(d).padStart(2,'0'));
  }

  var todayKey = todayStr();
  var todayEntries   = state.journal.filter(j => j.date === todayKey);
  var weekEntries    = state.journal.filter(j => getKeys(7).includes(j.date));
  var monthEntries   = state.journal.filter(j => monthKeys.includes(j.date));

  // unique days written
  var weekDays  = new Set(weekEntries.map(j=>j.date)).size;
  var monthDays = new Set(monthEntries.map(j=>j.date)).size;

  function moodBar(avg) {
    if (!avg) return '<span style="color:var(--text-muted);font-size:12px">—</span>';
    var pct = ((avg-1)/4)*100;
    var col = MOOD_COLOR[Math.round(avg)];
    return '<div style="display:flex;align-items:center;gap:8px">'
      + '<div style="flex:1;height:6px;background:var(--border);border-radius:99px;overflow:hidden">'
      + '<div style="height:100%;width:' + pct + '%;background:' + col + ';border-radius:99px;transition:width 0.5s"></div>'
      + '</div>'
      + '<span style="font-size:12px;color:' + col + ';font-weight:700;min-width:60px">' + (MOOD_LABEL[Math.round(avg)]||'—') + '</span>'
      + '</div>';
  }

  function sectionBlock(label, entries, daysLabel) {
    var avg = avgMood(entries);
    var dom = dominantMood(entries);
    var count = entries.length;
    if (!count) return '<div style="color:var(--text-muted);font-size:12px">ثبت نشده</div>';
    return '<div style="margin-top:4px">'
      + moodBar(avg)
      + '<div style="font-size:11px;color:var(--text-muted);margin-top:4px">' + count + ' ورودی' + (daysLabel ? ' · ' + daysLabel : '') + '</div>'
      + '</div>';
  }

  // today mood timeline
  var todayMoodLine = '';
  if (todayEntries.length) {
    var sorted = [...todayEntries].sort((a,b) => (a.time||'') > (b.time||'') ? 1 : -1);
    todayMoodLine = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">'
      + sorted.map(j => {
          var timeStr = j.time ? '<span style="font-size:10px;color:var(--text-muted);display:block">' + j.time + '</span>' : '';
          return '<div style="text-align:center;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:6px 10px">'
            + '<div style="font-size:20px">' + (j.mood||'📝') + '</div>'
            + timeStr
            + '</div>';
        }).join('')
      + '</div>';
  }

  // week mood per day (last 7 days as bars)
  var weekBarHtml = '<div style="display:flex;gap:4px;align-items:flex-end;height:50px;margin-top:8px">';
  var last7Keys = getKeys(7).reverse();
  last7Keys.forEach(function(key) {
    var dayEntries = state.journal.filter(j => j.date === key);
    var avg = avgMood(dayEntries);
    var pct = avg ? ((avg-1)/4)*100 : 0;
    var col = avg ? (MOOD_COLOR[Math.round(avg)] || 'var(--border)') : 'var(--border)';
    var parts = key.split('-');
    var dayNum = parseInt(parts[2]);
    var isToday = key === todayKey;
    weekBarHtml += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">'
      + '<div style="width:100%;background:var(--border);border-radius:4px 4px 0 0;height:40px;display:flex;align-items:flex-end;overflow:hidden">'
      + '<div style="width:100%;height:' + pct + '%;background:' + col + ';border-radius:4px 4px 0 0;transition:height 0.5s;min-height:' + (avg?'4px':'0') + '"></div>'
      + '</div>'
      + '<div style="font-size:10px;color:' + (isToday?'var(--accent)':'var(--text-muted)') + ';font-weight:' + (isToday?700:400) + '">' + dayNum + '</div>'
      + '</div>';
  });
  weekBarHtml += '</div>';

  el.innerHTML = '<div style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px">📊 خلاصه ژورنال</div>'

    + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px">'

    // امروز
    + '<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px">'
    + '<div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:6px">امروز</div>'
    + (todayEntries.length ? sectionBlock('امروز', todayEntries, '') : '<div style="color:var(--text-muted);font-size:12px">هنوز ننوشتی</div>')
    + '</div>'

    // هفته
    + '<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px">'
    + '<div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:6px">هفت روز</div>'
    + sectionBlock('هفته', weekEntries, weekDays + '/۷ روز')
    + '</div>'

    // ماه
    + '<div style="background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px">'
    + '<div style="font-size:11px;font-weight:700;color:var(--accent);margin-bottom:6px">' + J.monthNames[jm-1] + '</div>'
    + sectionBlock('ماه', monthEntries, monthDays + '/' + daysInMonth + ' روز')
    + '</div>'

    + '</div>'

    // timeline امروز
    + (todayEntries.length ? '<div style="margin-bottom:16px"><div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">روند حال امروز</div>' + todayMoodLine + '</div>' : '')

    // نمودار هفته
    + '<div style="margin-bottom:16px"><div style="font-size:11px;color:var(--text-muted);margin-bottom:2px">نمودار ۷ روز گذشته</div>' + weekBarHtml + '</div>'

    // نمودار ۶ ماه
    + (function() {
        var months = getLastNMonths(6);
        var bars = months.map(function(m) {
          var entries = journalEntriesInMonth(m.year, m.month);
          var avg = entries.length ? entries.reduce(function(s,j){ return s + MOOD_SCORE[j.mood]; }, 0) / entries.length : 0;
          var pct = avg ? ((avg-1)/4)*100 : 0;
          var col = avg ? (MOOD_COLOR[Math.round(avg)] || 'var(--green)') : 'var(--border)';
          return '<div class="trend-bar-col"><div class="trend-bar-wrap"><div class="trend-bar-fill" style="height:' + pct + '%;background:' + col + ';min-height:' + (avg?'3px':'0') + '"></div></div><div class="trend-bar-label">' + m.label + '</div></div>';
        }).join('');
        return '<div><div style="font-size:11px;color:var(--text-muted);margin-bottom:2px">روند خلق‌وخو — ۶ ماه اخیر</div><div class="trend-chart">' + bars + '</div></div>';
      })();
}

function renderJournal() {
  renderJournalSummary();
  const list = document.getElementById('journal-list');
  if (!list) return;
  if (!state.journal.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-emoji">📝</div>هنوز چیزی ننوشتی</div>';
    return;
  }

  // Group by date
  const groups = {};
  state.journal.forEach(j => {
    if (!groups[j.date]) groups[j.date] = [];
    groups[j.date].push(j);
  });

  const sortedDates = Object.keys(groups).sort((a,b) => b > a ? 1 : -1);

  list.innerHTML = sortedDates.map(date => {
    const entries = groups[date].sort((a,b) => {
      // sort by time if available, else by id
      if (a.time && b.time) return a.time > b.time ? 1 : -1;
      return b.id - a.id;
    });
    const isToday = date === todayStr();

    const entriesHtml = entries.map(j => {
      const timeLabel = j.time
        ? '<span style="font-size:11px;background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:2px 8px;margin-left:8px">🕐 ' + j.time + '</span>'
        : '';
      const moodLabel = j.mood
        ? '<span style="font-size:16px;margin-left:4px">' + j.mood + '</span>'
        : '';
      return '<div id="journal-item-' + j.id + '" style="position:relative;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px">'
        + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">'
        + '<div style="display:flex;align-items:center;gap:4px">' + moodLabel + timeLabel + '</div>'
        + '<button onclick="deleteJournalEntry(' + j.id + ')" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:4px" onmouseover="this.style.color=\'var(--red)\'" onmouseout="this.style.color=\'var(--text-muted)\'">✕</button>'
        + '</div>'
        + '<div style="font-size:14px;line-height:1.7;color:var(--text);white-space:pre-wrap">' + j.text.replace(/</g,'&lt;') + '</div>'
        + '</div>';
    }).join('');

    return '<div style="margin-bottom:20px">'
      + '<div style="font-size:12px;font-weight:700;color:' + (isToday ? 'var(--accent)' : 'var(--text-muted)') + ';margin-bottom:8px;display:flex;align-items:center;gap:8px">'
      + displayDate(date)
      + (isToday ? '<span style="background:' + accentHighlight(0.2) + ';border:1px solid var(--accent);border-radius:99px;padding:1px 8px;font-size:10px">امروز</span>' : '')
      + '<span style="color:var(--border)">(' + entries.length + ' ورودی)</span>'
      + '</div>'
      + entriesHtml
      + '</div>';
  }).join('');
}

// ─── TODOS ───────────────────────────────────────────────────────────────────
function addTodo() {
  const input = document.getElementById('todo-input');
  const text = input.value.trim();
  if (!text) return;
  
  const tag = document.getElementById('todo-tag').value.trim();
  const priority = document.getElementById('todo-priority').value;
  const dateRaw = document.getElementById('todo-date').value.trim();
  const dueDate = dateRaw ? dateRaw.replace(/\//g,'-') : '';
  const dueTime = document.getElementById('todo-time').value.trim();
  const repeatEl = document.getElementById('todo-repeat');
  const repeat = repeatEl ? repeatEl.value : 'none';
  
  state.todos.unshift({ id: Date.now(), text, priority, tag, dueDate, dueTime, done: false, repeat, streak: 0, subtasks: [] });
  save('todos');
  input.value = '';
  document.getElementById('todo-tag').value = '';
  document.getElementById('todo-date').value = '';
  document.getElementById('todo-time').value = '';
  if (repeatEl) repeatEl.value = 'none';
  renderTodos();
  updateStats();
}

// Computes the next occurrence's due-date key for a recurring todo,
// stepping forward from its current due date (or from today if it has none).
function nextRecurDate(dueDateKey, repeat) {
  const base = dueDateKey ? J.keyToGDate(dueDateKey) : new Date();
  const d = new Date(base);
  if (repeat === 'daily') d.setDate(d.getDate() + 1);
  else if (repeat === 'weekly') d.setDate(d.getDate() + 7);
  return J.gDateToKey(d);
}

function toggleTodo(id) {
  const t = state.todos.find(t => t.id === id);
  if (!t) return;
  // Completing a recurring task doesn't finish it forever — it rolls the due
  // date forward to the next occurrence, resets its subtasks, and bumps the streak.
  if (!t.done && t.repeat && t.repeat !== 'none') {
    t.streak = (t.streak || 0) + 1;
    t.dueDate = nextRecurDate(t.dueDate, t.repeat);
    if (Array.isArray(t.subtasks)) t.subtasks.forEach(s => s.done = false);
    t.done = false;
    save('todos'); renderTodos(); updateStats();
    return;
  }
  t.done = !t.done; save('todos'); renderTodos(); updateStats();
}

function deleteTodo(id) {
  state.todos = state.todos.filter(t => t.id !== id);
  save('todos'); renderTodos(); updateStats();
}

// ─── SUBTASKS ────────────────────────────────────────────────────────────────
// UI-only (not persisted): which todo's subtask panel is currently expanded.
const todoSubtaskUI = {};

function toggleSubtaskPanel(id) {
  todoSubtaskUI[id] = !todoSubtaskUI[id];
  renderTodos();
  if (todoSubtaskUI[id]) {
    setTimeout(() => {
      const inp = document.getElementById('subtask-input-' + id);
      if (inp) inp.focus();
    }, 30);
  }
}

function addSubtask(todoId) {
  const t = state.todos.find(t => t.id === todoId);
  if (!t) return;
  const input = document.getElementById('subtask-input-' + todoId);
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;
  if (!Array.isArray(t.subtasks)) t.subtasks = [];
  t.subtasks.push({ id: Date.now(), text, done: false });
  todoSubtaskUI[todoId] = true;
  save('todos');
  renderTodos();
  setTimeout(() => {
    const inp = document.getElementById('subtask-input-' + todoId);
    if (inp) inp.focus();
  }, 30);
}

function toggleSubtaskDone(todoId, subId) {
  const t = state.todos.find(t => t.id === todoId);
  if (!t || !Array.isArray(t.subtasks)) return;
  const s = t.subtasks.find(s => s.id === subId);
  if (!s) return;
  s.done = !s.done;
  save('todos');
  renderTodos();
}

function deleteSubtask(todoId, subId) {
  const t = state.todos.find(t => t.id === todoId);
  if (!t || !Array.isArray(t.subtasks)) return;
  t.subtasks = t.subtasks.filter(s => s.id !== subId);
  save('todos');
  renderTodos();
}

// Renders the collapsible subtask checklist + progress bar under a todo item.
function renderSubtasksPanel(t) {
  const subs = Array.isArray(t.subtasks) ? t.subtasks : [];
  const doneCount = subs.filter(s => s.done).length;
  const isOpen = !!todoSubtaskUI[t.id];
  const pct = subs.length ? Math.round(doneCount / subs.length * 100) : 0;

  return `
    <div style="margin-top:6px">
      <div style="display:flex;align-items:center;gap:8px;cursor:pointer" onclick="toggleSubtaskPanel(${t.id})">
        ${subs.length ? `
          <div style="height:4px;width:70px;background:var(--border);border-radius:99px;overflow:hidden;flex-shrink:0">
            <div style="height:100%;width:${pct}%;background:var(--accent2);border-radius:99px"></div>
          </div>
          <span style="font-size:11px;color:var(--text-muted)">${doneCount}/${subs.length} زیرکار</span>
        ` : `<span style="font-size:11px;color:var(--text-muted)">＋ زیرکار</span>`}
        <span style="font-size:9px;color:var(--text-muted)">${isOpen ? '▲' : '▼'}</span>
      </div>
      ${isOpen ? `
        <div style="margin-top:6px;padding-right:10px;border-right:2px solid var(--border)">
          ${subs.map(s => `
            <div style="display:flex;align-items:center;gap:8px;padding:3px 0">
              <div class="todo-check" style="width:16px;height:16px;margin-top:0;${s.done ? 'background:var(--green);border-color:var(--green)' : ''}" onclick="event.stopPropagation();toggleSubtaskDone(${t.id},${s.id})">${s.done ? '✓' : ''}</div>
              <div style="flex:1;font-size:12.5px;${s.done ? 'text-decoration:line-through;opacity:0.5' : ''}">${esc(s.text)}</div>
              <button onclick="event.stopPropagation();deleteSubtask(${t.id},${s.id})" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:12px">✕</button>
            </div>
          `).join('')}
          <div style="display:flex;gap:6px;margin-top:6px" onclick="event.stopPropagation()">
            <input type="text" id="subtask-input-${t.id}" placeholder="زیرکار جدید..." style="flex:1;font-size:12px;padding:6px 10px" onkeydown="if(event.key==='Enter')addSubtask(${t.id})">

          </div>
        </div>
      ` : ''}
    </div>
  `;
}

// Small badge showing repeat cadence + streak, shown alongside the due-date badge.
function repeatBadge(t) {
  if (!t.repeat || t.repeat === 'none') return '';
  const label = t.repeat === 'daily' ? 'هر روز' : 'هر هفته';
  const streak = t.streak ? ` · 🔥${t.streak}` : '';
  return `<span style="font-size:11px;color:var(--accent2);margin-right:6px">🔁 ${label}${streak}</span>`;
}

function saveEditTodo(id) {
  const t = state.todos.find(t => t.id === id);
  if (!t) return;
  const text = document.getElementById('edit-todo-text').value.trim();
  if (!text) return;
  t.text = text;
  t.priority = document.getElementById('edit-todo-priority').value;
  t.tag = document.getElementById('edit-todo-tag').value.trim();
  const dateRaw = document.getElementById('edit-todo-date').value.trim();
  t.dueDate = dateRaw ? dateRaw.replace(/\//g,'-') : '';
  t.dueTime = document.getElementById('edit-todo-time').value.trim();
  const repeatEl = document.getElementById('edit-todo-repeat');
  if (repeatEl) t.repeat = repeatEl.value;
  save('todos');
  closeModal();
  renderTodos();
}

function clearDone() {
  state.todos = state.todos.filter(t => !t.done);
  save('todos'); renderTodos(); updateStats();
}

  const total = all.length;

      <div style="flex:1;min-width:120px">
        <div style="height:8px;background:var(--border);border-radius:99px;overflow:hidden;margin-bottom:6px">
          <div style="height:100%;width:${donePercent}%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:99px;transition:width 0.5s"></div>
        </div>
        <div style="font-size:11px;color:var(--text-muted)">${done.length} از ${total} کار انجام شده</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin-bottom:${overdue.length||dueToday.length?'14px':'0'}">
      <div style="background:var(--surface2);border-radius:8px;padding:10px;text-align:center;border:1px solid var(--border)">
        <div style="font-size:20px;font-weight:800;color:var(--red)">${high.length}</div>
        <div style="font-size:10px;color:var(--text-muted);margin-top:2px">🔴 فوری</div>

      <div style="background:var(--surface2);border-radius:8px;padding:10px;text-align:center;border:1px solid var(--border)">
        <div style="font-size:20px;font-weight:800;color:var(--accent)">${mid.length}</div>
        <div style="font-size:10px;color:var(--text-muted);margin-top:2px">🟡 معمولی</div>
      </div>
      <div style="background:var(--surface2);border-radius:8px;padding:10px;text-align:center;border:1px solid var(--border)">
        <div style="font-size:20px;font-weight:800;color:var(--green)">${low.length}</div>
        <div style="font-size:10px;color:var(--text-muted);margin-top:2px">🟢 زمانی</div>
      </div>
      <div style="background:var(--surface2);border-radius:8px;padding:10px;text-align:center;border:1px solid var(--border)">
        <div style="font-size:20px;font-weight:800;color:var(--green)">${done.length}</div>
        <div style="font-size:10px;color:var(--text-muted);margin-top:2px">✅ تموم شده</div>
