async function requestNotifPermission() {
  if (!('Notification' in window)) return;
  const p = await Notification.requestPermission();
  if (p === 'granted') showToast('✅ اعلان‌ها فعال شد');
  else showToast('⚠️ اجازه اعلان داده نشد');
  openNotifSettings();
}

async function saveNotifSettingsFromModal() {
  const enabled = document.getElementById('notif-enabled').checked;
  const s = {
    enabled,
    todoMinutes: parseInt(document.getElementById('notif-todo-min').value) || 60,
    meetingMinutes: parseInt(document.getElementById('notif-meeting-min').value) || 30
  };
  saveNotifSettings(s);
  if (enabled && 'Notification' in window && Notification.permission === 'default') {
    await Notification.requestPermission();
  }
  closeModal();
  startNotifScheduler();
  showToast('✅ تنظیمات یادآوری ذخیره شد');
}

function parseDueDateTime(dateKey, timeStr) {
  if (!dateKey) return null;
  const d = J.keyToGDate(dateKey);
  if (timeStr && /^\d{1,2}:\d{2}$/.test(timeStr)) {
    const [h, m] = timeStr.split(':').map(Number);
    d.setHours(h, m, 0, 0);
  } else {
    d.setHours(9, 0, 0, 0);
  }
  return d;
}

function checkAndNotify() {
  const s = getNotifSettings();
  if (!s.enabled || !('Notification' in window) || Notification.permission !== 'granted') return;

  const now = Date.now();

  state.todos.filter(t => !t.done && t.dueDate).forEach(t => {
    const due = parseDueDateTime(t.dueDate, t.dueTime);
    if (!due) return;
    const leadMs = (s.todoMinutes || 60) * 60000;
    const key = 'todo-' + t.id + '-' + t.dueDate + '-' + (t.dueTime || '');
    if (now >= due.getTime() - leadMs && now <= due.getTime() + 300000 && !notifiedKeys.has(key)) {
      notifiedKeys.add(key);
      new Notification('⏰ یادآوری کار', {
        body: t.text + (t.dueTime ? ' · ' + t.dueTime : ''),
        icon: APP_ICON,
        tag: key
      });
    }
  });

  const today = todayStr();
  state.meetings.filter(m => J.compareKeys(m.date, today) >= 0).forEach(m => {
    const due = parseDueDateTime(m.date, m.time || '09:00');
    if (!due) return;
    const leadMs = (s.meetingMinutes || 30) * 60000;
    const key = 'meeting-' + m.id + '-' + m.date + '-' + (m.time || '');
    if (now >= due.getTime() - leadMs && now <= due.getTime() + 300000 && !notifiedKeys.has(key)) {
      notifiedKeys.add(key);
      new Notification('📅 یادآوری جلسه', {
        body: m.title + (m.time ? ' · ' + m.time : '') + (m.with ? ' · با ' + m.with : ''),
        icon: APP_ICON,
        tag: key
      });
    }
  });

  persistNotifiedKeys();
}

function startNotifScheduler() {
  if (notifTimer) clearInterval(notifTimer);
  checkAndNotify();
  notifTimer = setInterval(checkAndNotify, 60000);
}

// ─── DRAG & DROP ─────────────────────────────────────────────────────────────
let dragTodoId = null;
let dragIdeaId = null;

function onTodoDragStart(e) {
  dragTodoId = parseInt(e.currentTarget.dataset.todoId);
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(dragTodoId));
}

function onTodoDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.todo-item.drag-over').forEach(el => el.classList.remove('drag-over'));
  dragTodoId = null;
}

function onTodoDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}

function onTodoDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function onTodoDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  const targetId = parseInt(e.currentTarget.dataset.todoId);
  const targetPriority = e.currentTarget.dataset.priority;
  const fromId = dragTodoId || parseInt(e.dataTransfer.getData('text/plain'));
  if (!fromId || fromId === targetId) return;

  const fromIdx = state.todos.findIndex(t => t.id === fromId);
  const toIdx = state.todos.findIndex(t => t.id === targetId);
  if (fromIdx < 0 || toIdx < 0) return;

  const [item] = state.todos.splice(fromIdx, 1);
  if (targetPriority === 'done') item.done = true;
  else {
    if (item.done) item.done = false;
    if (targetPriority) item.priority = targetPriority;
  }
  const newToIdx = state.todos.findIndex(t => t.id === targetId);
  state.todos.splice(newToIdx, 0, item);

  save('todos');
  renderTodos();
  e.currentTarget.classList.remove('drag-over');
}

function onIdeaDragStart(e) {
  if (e.target.closest('button')) { e.preventDefault(); return; }
  dragIdeaId = parseInt(e.currentTarget.dataset.ideaId);
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(dragIdeaId));
}

function onIdeaDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.idea-card.drag-over').forEach(el => el.classList.remove('drag-over'));
  dragIdeaId = null;
}

function onIdeaDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}

function onIdeaDragLeave(e) {
  e.currentTarget.classList.remove('drag-over');
}

function onIdeaDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  const targetId = parseInt(e.currentTarget.dataset.ideaId);
  const fromId = dragIdeaId || parseInt(e.dataTransfer.getData('text/plain'));
  if (!fromId || fromId === targetId) return;

  const fromIdx = state.ideas.findIndex(i => i.id === fromId);
  const toIdx = state.ideas.findIndex(i => i.id === targetId);
  if (fromIdx < 0 || toIdx < 0) return;

  const [item] = state.ideas.splice(fromIdx, 1);
  const newToIdx = state.ideas.findIndex(i => i.id === targetId);
  state.ideas.splice(newToIdx, 0, item);

  save('ideas');
  renderIdeas();
  e.currentTarget.classList.remove('drag-over');
}

// ─── LONG-TERM TRENDS ────────────────────────────────────────────────────────
const MOOD_SCORE_MAP = { '😁':5, '🙂':4, '😐':3, '😔':2, '😤':2, '😰':1 };

function getLastNMonths(n) {
  const months = [];
  const [jy, jm] = J.todayJ();
  let y = jy, m = jm;
  for (let i = 0; i < n; i++) {
    months.unshift({ year: y, month: m, label: J.monthNames[m - 1].slice(0, 3) });
    m--;
    if (m < 1) { m = 12; y--; }
  }
  return months;
}

function journalEntriesInMonth(year, month) {
  const prefix = year + '-' + String(month).padStart(2, '0') + '-';
  return state.journal.filter(j => j.date && j.date.startsWith(prefix) && j.mood && MOOD_SCORE_MAP[j.mood]);
}

function renderLongTermTrends() {
  const el = document.getElementById('dashboard-trends');
  if (!el) return;

  const rangeEl = document.getElementById('trend-range');
  const monthsCount = rangeEl ? parseInt(rangeEl.value) || 6 : 6;
  const months = getLastNMonths(monthsCount);

  const moodAvgs = months.map(({ year, month, label }) => {
    const entries = journalEntriesInMonth(year, month);
    if (!entries.length) return { label, avg: 0, hasData: false };
    const avg = entries.reduce((s, j) => s + MOOD_SCORE_MAP[j.mood], 0) / entries.length;
    return { label, avg, hasData: true };
  });

  const activeGoals = state.goals.filter(g => g.progress < 100);
  const goalAvgs = months.map(({ year, month, label }) => {
    const monthEnd = year + '-' + String(month).padStart(2, '0') + '-31';
    let sum = 0, count = 0;
    state.goals.forEach(g => {
      let prog = g.progress || 0;
      if (Array.isArray(g.history) && g.history.length) {
        const inMonth = g.history.filter(h => h.date && h.date.startsWith(year + '-' + String(month).padStart(2, '0')));
        if (inMonth.length) prog = inMonth[inMonth.length - 1].progress;
        else {
          const before = g.history.filter(h => h.date && J.compareKeys(h.date, monthEnd) <= 0);
          if (before.length) prog = before[before.length - 1].progress;
        }
      }
      sum += prog;
      count++;
    });
    return { label, avg: count ? sum / count : 0, hasData: count > 0 };
  });

  function buildChart(data, color, maxVal) {
    return '<div class="trend-chart">' + data.map(d => {
      const pct = d.hasData ? Math.round((d.avg / maxVal) * 100) : 0;
      const col = d.hasData ? color : 'var(--border)';
      return '<div class="trend-bar-col" title="' + d.label + ': ' + (d.hasData ? Math.round(d.avg * 10) / 10 : '—') + '">'
        + '<div class="trend-bar-wrap"><div class="trend-bar-fill" style="height:' + pct + '%;background:' + col + ';min-height:' + (d.hasData ? '3px' : '0') + '"></div></div>'
        + '<div class="trend-bar-label">' + d.label + '</div>'
        + '</div>';
    }).join('') + '</div>';
  }

  const moodHasAny = moodAvgs.some(m => m.hasData);
  const goalHasAny = goalAvgs.some(g => g.hasData);

  if (!moodHasAny && !goalHasAny && !state.goals.length && !state.journal.length) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:12px">با ثبت ژورنال و اهداف، روند بلندمدت اینجا نمایش داده می‌شه</div>';
    return;
  }

  el.innerHTML = ''
    + '<div style="margin-bottom:20px">'
    + '<div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:4px">😊 میانگین خلق‌وخو (ماهانه)</div>'
    + (moodHasAny ? buildChart(moodAvgs, 'var(--green)', 5) : '<div style="font-size:12px;color:var(--text-muted)">داده کافی نیست</div>')
    + '</div>'
    + '<div>'
    + '<div style="font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:4px">🎯 میانگین پیشرفت اهداف (ماهانه)</div>'
    + (goalHasAny || state.goals.length ? buildChart(goalAvgs, 'var(--accent2)', 100) : '<div style="font-size:12px;color:var(--text-muted)">هدفی ثبت نشده</div>')
    + '</div>';
}

// ─── ENCRYPTION (CLOUD SYNC) ─────────────────────────────────────────────────
let syncCryptoKey = null; // CryptoKey in memory

function isEncryptionEnabled() {
  return localStorage.getItem('sb_encryption_enabled') === 'true';
}

function setEncryptionEnabled(on) {
  localStorage.setItem('sb_encryption_enabled', on ? 'true' : 'false');
  if (!on) { syncCryptoKey = null; localStorage.removeItem('sb_encryption_salt'); }
}

function getEncryptionSalt() {
  let salt = localStorage.getItem('sb_encryption_salt');
  if (!salt) {
    const arr = crypto.getRandomValues(new Uint8Array(16));
    salt = btoa(String.fromCharCode(...arr));
    localStorage.setItem('sb_encryption_salt', salt);
  }
  return Uint8Array.from(atob(salt), c => c.charCodeAt(0));
}

async function deriveKeyFromPassphrase(passphrase) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: getEncryptionSalt(), iterations: 120000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['encrypt', 'decrypt']
  );
}

async function ensureSyncCryptoKey(forcePrompt) {
  if (!isEncryptionEnabled()) return null;
  if (syncCryptoKey && !forcePrompt) return syncCryptoKey;
  const saved = sessionStorage.getItem('sb_crypto_session');
  if (saved && !forcePrompt) {
    try {
      const raw = Uint8Array.from(atob(saved), c => c.charCodeAt(0));
      syncCryptoKey = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']);
      return syncCryptoKey;
    } catch(e) { /* fall through */ }
  }
  return new Promise(resolve => {
    const content = document.getElementById('modal-content');
    content.innerHTML = `
      <div class="modal-title">🔐 رمز سینک</div>
      <div style="font-size:13px;color:var(--text-muted);line-height:1.8;margin-bottom:14px">
        داده‌ها قبل از آپلود با AES-256-GCM رمزنگاری می‌شن. Supabase فقط متن رمزشده می‌بینه.
      </div>
      <div class="form-group">
        <label class="form-label">رمز عبور سینک</label>
        <input type="password" id="sync-pass-input" placeholder="رمز سینک..." style="width:100%;direction:ltr">
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);margin-bottom:14px;cursor:pointer">
        <input type="checkbox" id="sync-pass-remember"> به خاطر سپردن در این نشست
      </label>
      <div id="sync-pass-msg" style="font-size:12px;color:var(--red);margin-bottom:8px"></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" id="sync-pass-ok">تأیید</button>
        <button class="btn btn-ghost" onclick="closeModal();window._syncCryptoResolve(null)">انصراف</button>
      </div>
    `;
    document.getElementById('modal').classList.add('open');
    window._syncCryptoResolve = resolve;
    document.getElementById('sync-pass-ok').onclick = async () => {
      const pass = document.getElementById('sync-pass-input').value;
      const msg = document.getElementById('sync-pass-msg');
      if (!pass) { msg.textContent = 'رمز رو وارد کن.'; return; }
      try {
        syncCryptoKey = await deriveKeyFromPassphrase(pass);
        if (document.getElementById('sync-pass-remember').checked) {
          const raw = await crypto.subtle.exportKey('raw', syncCryptoKey);
          sessionStorage.setItem('sb_crypto_session', btoa(String.fromCharCode(...new Uint8Array(raw))));
        }
        closeModal();
        resolve(syncCryptoKey);
      } catch(e) {
        msg.textContent = 'خطا: ' + e.message;
      }
    };
    setTimeout(() => document.getElementById('sync-pass-input').focus(), 100);
  });
}

async function encryptField(plaintext) {
  const key = await ensureSyncCryptoKey(false);
  if (!key) throw new Error('رمز سینک لازمه');
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(plaintext));
  return JSON.stringify({
    enc: true,
    v: 1,
    iv: btoa(String.fromCharCode(...iv)),
    data: btoa(String.fromCharCode(...new Uint8Array(cipher)))
  });
}

async function decryptField(stored) {
  if (!stored) return '[]';
  let parsed;
  try { parsed = JSON.parse(stored); } catch(e) { return stored; }
  if (!parsed || !parsed.enc) return stored;

  const key = await ensureSyncCryptoKey(false);
  if (!key) throw new Error('رمز سینک برای رمزگشایی لازمه');

  const iv = Uint8Array.from(atob(parsed.iv), c => c.charCodeAt(0));
  const data = Uint8Array.from(atob(parsed.data), c => c.charCodeAt(0));
  const dec = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
  return new TextDecoder().decode(dec);
}

function openEncryptionSettings() {
  const content = document.getElementById('modal-content');
  content.innerHTML = `
    <div class="modal-title">🔐 رمزنگاری سینk ابری</div>
    <div style="font-size:13px;color:var(--text-muted);line-height:1.8;margin-bottom:14px">
      با فعال‌سازی، همه فیلدها (ژورنال، کارها، اهداف...) قبل از آپلود رمز می‌شن.
      رمز سینk رو فراموش نکن — بدون اون داده قابل بازیابی نیست.
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-bottom:14px;cursor:pointer">
      <input type="checkbox" id="enc-enabled" ${isEncryptionEnabled()?'checked':''}>
      <span>فعال‌سازی رمزنگاری</span>
    </label>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" onclick="saveEncryptionSettings()">ذخیره</button>
      <button class="btn btn-ghost" onclick="closeModal()">بستن</button>
    </div>
  `;
  document.getElementById('modal').classList.add('open');
}

async function saveEncryptionSettings() {
  const on = document.getElementById('enc-enabled').checked;
  setEncryptionEnabled(on);
  if (on) await ensureSyncCryptoKey(true);
  closeModal();
  showToast(on ? '🔐 رمزنگاری فعال شد' : 'رمزنگاری غیرفعال شد');
}

// ─── PWA ─────────────────────────────────────────────────────────────────────
const APP_ICON = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect fill="#6d5af0" width="192" height="192" rx="40"/><text x="96" y="128" font-size="88" text-anchor="middle" fill="#fff" font-family="sans-serif">م</text></svg>'
);

function setupManifest() {
  const link = document.getElementById('app-manifest');
  if (!link) return;
  const manifest = {
    name: 'مغزم',
    short_name: 'مغزم',
    description: 'ژورنال، کارها، اهداف و ایده‌های شخصی',
    start_url: './index.html',
    scope: './',
    display: 'standalone',
    orientation: 'portrait-primary',
    background_color: '#0d0d0f',
    theme_color: '#0d0d0f',
    lang: 'fa',
    dir: 'rtl',

      { src: APP_ICON, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
    ]
  };
  link.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest));
}

function registerServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  const swCode = `
    const CACHE = 'maghzam-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.add(self.location.href)).then(() => self.skipWaiting()));
    });
    self.addEventListener('activate', e => {
      e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim()));
    });
    self.addEventListener('fetch', e => {
      if (e.request.method !== 'GET') return;
      const url = new URL(e.request.url);
      if (url.hostname.includes('supabase')) {
        e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
        return;
      }
      e.respondWith(caches.match(e.request).then(cached => {
        const net = fetch(e.request).then(res => {
          if (res && res.status === 200 && url.origin === self.location.origin) {
            caches.open(CACHE).then(c => c.put(e.request, res.clone()));
          }
          return res;
        }).catch(() => cached);
        return cached || net;
      }));
    });
  `;
  const blobUrl = URL.createObjectURL(new Blob([swCode], { type: 'application/javascript' }));
  navigator.serviceWorker.register(blobUrl).catch(err => console.warn('SW registration failed:', err));
}

function setupInstallPrompt() {
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    showToast('📲 می‌تونی «مغزم» رو نصب کنی — از منوی مرورگر «Add to Home Screen»');
  });
  window.installPWA = async () => {
    if (!deferredPrompt) { showToast('از منوی مرورگر «نصب اپ» یا «Add to Home Screen» رو بزن'); return; }
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  };
}
